services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: neolith
      POSTGRES_USER: neolith
      POSTGRES_PASSWORD: neolith_local
    ports:
      - "5432:5432"
    volumes:
      - neolith_postgres:/var/lib/postgresql/data
      - ../specs/sql/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neolith -d neolith"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - neolith_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  opa:
    image: openpolicyagent/opa:latest-static
    command:
      - run
      - --server
      - --addr=0.0.0.0:8181
      - --set=decision_logs.console=true
      - /policy/neolith.rego
    ports:
      - "8181:8181"
    volumes:
      - ../policy/rego:/policy:ro

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

volumes:
  neolith_postgres:
  neolith_redis:
