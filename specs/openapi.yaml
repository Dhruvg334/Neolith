openapi: 3.1.0
info:
  title: Neolith API
  version: 0.1.0
  description: Agentic decision and governed execution API.
servers:
  - url: http://localhost:8000/api/v1

paths:
  /health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: Service health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /ready:
    get:
      operationId: getReadiness
      responses:
        "200":
          description: Service ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: Service dependencies not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"

  /tasks:
    post:
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [request]
              properties:
                request:
                  type: string
                  minLength: 1
      responses:
        "201":
          description: Task created
    get:
      operationId: listTasks
      responses:
        "200":
          description: Task list

  /tasks/{task_id}:
    get:
      operationId: getTask
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Task detail

  /tasks/{task_id}/message:
    post:
      operationId: addTaskMessage
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Message accepted

  /agents:
    get:
      operationId: listAgents
      responses:
        "200":
          description: Agent list
    post:
      operationId: createAgent
      responses:
        "201":
          description: Agent created

  /tools:
    get:
      operationId: listTools
      responses:
        "200":
          description: Tool list
    post:
      operationId: createTool
      responses:
        "201":
          description: Tool created

  /permissions/effective:
    get:
      operationId: getEffectivePermissions
      responses:
        "200":
          description: Effective permissions

  /budgets:
    get:
      operationId: listBudgets
      responses:
        "200":
          description: Budget list
    post:
      operationId: createBudget
      responses:
        "201":
          description: Budget created

  /actions/evaluate:
    post:
      operationId: evaluateAction
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./schemas/execution-request.schema.json"
      responses:
        "200":
          description: Governance decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernanceDecision"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"

  /actions/{action_id}:
    get:
      operationId: getAction
      parameters:
        - $ref: "#/components/parameters/ActionId"
      responses:
        "200":
          description: Action detail

  /actions/{action_id}/result:
    post:
      operationId: reportActionResult
      parameters:
        - $ref: "#/components/parameters/ActionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Result reconciled

  /approvals:
    get:
      operationId: listApprovals
      responses:
        "200":
          description: Approval list

  /approvals/{approval_id}/approve:
    post:
      operationId: approveAction
      parameters:
        - $ref: "#/components/parameters/ApprovalId"
      responses:
        "200":
          description: Approved

  /approvals/{approval_id}/reject:
    post:
      operationId: rejectAction
      parameters:
        - $ref: "#/components/parameters/ApprovalId"
      responses:
        "200":
          description: Rejected

  /permits/{permit_id}/consume:
    post:
      operationId: consumePermit
      parameters:
        - $ref: "#/components/parameters/PermitId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Permit consumed

  /agents/{agent_id}/quarantine:
    post:
      operationId: quarantineAgent
      parameters:
        - $ref: "#/components/parameters/AgentId"
      responses:
        "200":
          description: Agent quarantined

  /system/emergency-stop:
    post:
      operationId: emergencyStop
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Emergency stop activated

  /system/restore:
    post:
      operationId: restoreSystem
      responses:
        "200":
          description: System restored

  /receipts/{receipt_id}:
    get:
      operationId: getReceipt
      parameters:
        - $ref: "#/components/parameters/ReceiptId"
      responses:
        "200":
          description: Receipt detail

  /receipts/{receipt_id}/verify:
    post:
      operationId: verifyReceipt
      parameters:
        - $ref: "#/components/parameters/ReceiptId"
      responses:
        "200":
          description: Receipt verification

  /evaluation/runs:
    post:
      operationId: createEvaluationRun
      responses:
        "202":
          description: Evaluation started

  /financial/accounts:
    get:
      operationId: listFinancialAccounts
      responses:
        "200":
          description: List synthetic financial accounts

  /financial/accounts/{account_id}:
    get:
      operationId: getFinancialAccount
      parameters:
        - name: account_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Financial account detail
        "404":
          $ref: "#/components/responses/Problem"

  /financial/invoices:
    get:
      operationId: listFinancialInvoices
      responses:
        "200":
          description: List synthetic vendor invoices

  /financial/invoices/{invoice_id}:
    get:
      operationId: getFinancialInvoice
      parameters:
        - name: invoice_id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Invoice detail
        "404":
          $ref: "#/components/responses/Problem"

  /financial/beneficiaries:
    get:
      operationId: listFinancialBeneficiaries
      responses:
        "200":
          description: List synthetic beneficiaries

  /financial/transactions:
    get:
      operationId: listFinancialTransactions
      responses:
        "200":
          description: List synthetic financial transactions

  /financial/budgets:
    get:
      operationId: listFinancialBudgets
      responses:
        "200":
          description: List monthly category budgets with used and available balances

  /financial/summary:
    get:
      operationId: getFinancialSummary
      responses:
        "200":
          description: Aggregated financial reference summary

  /financial/tools:
    get:
      operationId: listFinancialTools
      responses:
        "200":
          description: Registered Financial Agent tools metadata

  /financial/seed:
    post:
      operationId: seedFinancialDemoData
      responses:
        "200":
          description: Seeded or reset deterministic financial reference data

  /interactions/message:
    post:
      operationId: sendWebInteractionMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: {type: string, minLength: 1, maxLength: 12000}
                task_id: {type: [string, "null"], format: uuid}
      responses:
        "200":
          description: Standard interface response
          content:
            application/json:
              schema:
                $ref: "./schemas/interface-response.schema.json"

  /integrations/twilio/whatsapp/webhook:
    post:
      operationId: handleTwilioWhatsAppWebhook
      responses:
        "200":
          description: Twilio XML acknowledgement response

  /integrations/elevenlabs/v1/chat/completions:
    post:
      operationId: elevenLabsChatCompletions
      responses:
        "200":
          description: OpenAI-compatible SSE text/event-stream chunks

  /governance/profiles:
    get:
      operationId: listGovernanceProfiles
      responses:
        "200":
          description: List governance profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GovernanceProfile"
    post:
      operationId: createGovernanceProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GovernanceProfileCreate"
      responses:
        "201":
          description: Created governance profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernanceProfile"

  /governance/profiles/active:
    get:
      operationId: getActiveGovernanceProfile
      responses:
        "200":
          description: Active governance profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernanceProfile"

  /governance/profiles/{profile_id}/activate:
    post:
      operationId: activateGovernanceProfile
      parameters:
        - name: profile_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Activated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernanceProfile"
        "404":
          $ref: "#/components/responses/Problem"

  /governance/profiles/{profile_id}:
    put:
      operationId: updateGovernanceProfile
      parameters:
        - name: profile_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GovernanceProfileUpdate"
      responses:
        "200":
          description: Updated governance profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernanceProfile"
        "404":
          $ref: "#/components/responses/Problem"

  /governance/decisions:
    get:
      operationId: listGovernanceDecisions
      parameters:
        - name: limit
          in: query
          required: false
          schema: {type: integer, default: 50}
        - name: outcome
          in: query
          required: false
          schema: {type: string}
      responses:
        "200":
          description: List governance decisions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GovernanceDecision"

  /governance/decisions/{action_id}:
    get:
      operationId: getGovernanceDecision
      parameters:
        - name: action_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Detailed governance decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernanceDecision"
        "404":
          $ref: "#/components/responses/Problem"


components:
  parameters:
    TaskId:
      name: task_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ActionId:
      name: action_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    AgentId:
      name: agent_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ApprovalId:
      name: approval_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    PermitId:
      name: permit_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ReceiptId:
      name: receipt_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16

  responses:
    Problem:
      description: Problem detail
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    GovernanceDecision:
      type: object
      required: [action_id, decision, reason_codes, trace_id]
      properties:
        action_id: {type: string, format: uuid}
        decision:
          type: string
          enum: [allow, deny, review, allow_with_constraints]
        outcome:
          type: string
          enum: [allow, deny, review, allow_with_constraints]
        reason_codes:
          type: array
          items: {type: string}
        risk_tier: {type: string}
        profile_id: {type: [string, "null"], format: uuid}
        profile_name: {type: string}
        profile_style: {type: string}
        profile_version: {type: string}
        budget_check: {type: [object, "null"]}
        tool_metadata: {type: [object, "null"]}
        permit:
          oneOf:
            - $ref: "./schemas/execution-permit.schema.json"
            - type: "null"
        approval:
          type: [object, "null"]
        trace_id: {type: string}
        created_at: {type: string, format: date-time}

    GovernanceProfile:
      type: object
      required: [id, name, style, description, version, active, configuration, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        style:
          type: string
          enum: [strict, balanced, high_autonomy, custom]
        description: {type: string}
        version: {type: string}
        active: {type: boolean}
        configuration: {type: object}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    GovernanceProfileCreate:
      type: object
      required: [name, style, description]
      properties:
        name: {type: string, minLength: 3, maxLength: 128}
        style:
          type: string
          enum: [strict, balanced, high_autonomy, custom]
        description: {type: string, minLength: 10, maxLength: 1000}
        configuration: {type: object}

    GovernanceProfileUpdate:
      type: object
      properties:
        description: {type: string, minLength: 10, maxLength: 1000}
        configuration: {type: object}

    HealthResponse:
      type: object
      required: [status, service, version]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
        version:
          type: string

    DependencyStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, error]
        detail:
          type: [string, "null"]

    ReadinessResponse:
      type: object
      required: [status, service, version, dependencies]
      properties:
        status:
          type: string
          enum: [ready, degraded]
        service:
          type: string
        version:
          type: string
        dependencies:
          type: object
          required: [postgres, redis, opa]
          properties:
            postgres:
              $ref: "#/components/schemas/DependencyStatus"
            redis:
              $ref: "#/components/schemas/DependencyStatus"
            opa:
              $ref: "#/components/schemas/DependencyStatus"

    Problem:
      type: object
      required: [type, title, status, detail]
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        reason_code: {type: string}
        trace_id: {type: string}

