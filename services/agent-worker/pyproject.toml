[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neolith-agent-worker"
version = "0.1.0"
description = "Neolith stateful LangGraph agent worker for grounded research, comparison, and action proposals"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10.0,<3.0.0",
  "httpx>=0.28.0,<1.0.0",
  "langgraph>=0.2.0,<1.0.0",
  "openai>=1.50.0,<2.0.0",
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn[standard]>=0.32.0,<1.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
