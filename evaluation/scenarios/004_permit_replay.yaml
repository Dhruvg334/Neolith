id: financial_permit_replay
title: Financial execution permit cannot be consumed twice
setup:
  invoice_number: INV-001
  vendor: Acme Cloud
  amount: "8000.00"
steps:
  - use_valid_permit
  - reuse_same_permit
expected:
  first_execution: succeeded
  second_execution: denied
  second_reason_code: PERMIT_REPLAY
  protected_execution_count: 1
