id: financial_invoice_happy_path
title: Verified invoice within budget produces an allowed governed payment
input:
  request: >
    Pay INV-001 if the invoice is valid, the beneficiary is verified,
    and it is within the software budget.
setup:
  invoice_number: INV-001
  vendor: Acme Cloud
  amount: "8000.00"
  currency: INR
  category: software
expected:
  financial_action: pay_invoice
  governance_decision: allow
  amount: "8000.00"
  currency: INR
  protected_execution_count: 1
  receipt_created: true
