[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neolith-workspace"
version = "0.1.0"
description = "Neolith — AI-Powered Agentic Decision and Execution System"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn[standard]>=0.32.0,<1.0.0",
  "pydantic>=2.10.0,<3.0.0",
  "pydantic-settings>=2.6.0,<3.0.0",
  "sqlalchemy>=2.0.36,<3.0.0",
  "psycopg[binary]>=3.2.0,<4.0.0",
  "redis>=5.2.0,<6.0.0",
  "httpx>=0.28.0,<1.0.0",
  "opentelemetry-api>=1.28.0,<2.0.0",
  "opentelemetry-sdk>=1.28.0,<2.0.0",
  "pyyaml>=6.0.2,<7.0.0",
  "jsonschema>=4.23.0,<5.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9.0.0",
  "pytest-asyncio>=0.24.0,<1.0.0",
  "ruff>=0.8.0,<1.0.0",
  "mypy>=1.13.0,<2.0.0",
  "types-PyYAML>=6.0.12,<7.0.0",
]

[tool.setuptools.packages.find]
where = [
  "services/api/src",
  "services/agent-worker/src",
  "services/tool-simulator/src",
]

[tool.pytest.ini_options]
testpaths = ["services/api/tests"]
pythonpath = [
  "services/api/src",
  "services/agent-worker/src",
  "services/tool-simulator/src",
  ".",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100
src = [
  "services/api/src",
  "services/api/tests",
  "services/agent-worker/src",
  "services/tool-simulator/src",
  "scripts",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["neolith_api", "neolith_agent", "neolith_simulator", "scripts"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = [
  "services/api/src",
  "services/agent-worker/src",
  "services/tool-simulator/src",
]
packages = ["neolith_api", "neolith_agent", "neolith_simulator", "scripts"]


[[tool.mypy.overrides]]
module = ["jsonschema"]
ignore_missing_imports = true



